# Server
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/medical_system
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT
app.jwt.secret=MedicalAppointmentSystemSecretKeyForJWTTokenGeneration2024VeryLongSecretKey
app.jwt.access-token-expiration=1800000
app.jwt.refresh-token-expiration=604800000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=30000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# CORS
app.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.medical=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File storage
app.files.upload-dir=uploads
app.files.avatar-max-size-bytes=5242880

# Integrations: email
app.integrations.mail.enabled=true
app.integrations.mail.from=no-reply@medical-system.local
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=403c43a378a50c
spring.mail.password=fd551fa036de8c
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Integrations: Google Calendar
app.integrations.calendar.enabled=false
app.integrations.calendar.id=${GOOGLE_CALENDAR_ID:}
app.integrations.calendar.service-account-email=${GOOGLE_SERVICE_ACCOUNT_EMAIL:}
app.integrations.calendar.service-account-private-key-id=${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY_ID:}
app.integrations.calendar.service-account-private-key=${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:}
app.integrations.calendar.time-zone=Europe/Minsk

# Integrations: reminders
app.integrations.reminders.cron=0 */5 * * * *
